name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Prepare payload
        run: |
          set -o pipefail
          bash scripts/make-payload.sh 2>&1 | tee payload-build.log

      - name: Publish failure log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logout
          cp payload-build.log /tmp/logout/payload-build.log 2>/dev/null || true
          cp build-payload/chroot.log /tmp/logout/chroot.log 2>/dev/null || true
          cd /tmp/logout
          git init -q .
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "ci failure log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AstaPS-build${GITHUB_RUN_NUMBER}.apk"
          ls -lh AstaPS-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: astaps-apk
          path: AstaPS-*.apk
          compression-level: 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AstaPS APK ${{ github.run_number }}
          body: "自动构建的 AstaPS 安卓服务端 APK"
          files: AstaPS-*.apk
