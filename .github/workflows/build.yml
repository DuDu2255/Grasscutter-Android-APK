name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Prepare payload
        run: |
          set -o pipefail
          bash scripts/make-payload.sh 2>&1 | tee payload-build.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/astaps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/astaps-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AstaPS-build${GITHUB_RUN_NUMBER}.apk"
          cp app/src/main/assets/payload.bin payload.tar.gz
          ls -lh AstaPS-*.apk payload.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: astaps-apk
          path: AstaPS-*.apk
          compression-level: 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AstaPS APK ${{ github.run_number }}
          body: "自动构建的 AstaPS 安卓服务端 APK"
          files: |
            AstaPS-*.apk
            payload.tar.gz

      - name: Publish failure log
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logout && cd /tmp/logout
          cp "$GITHUB_WORKSPACE/payload-build.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/gradle-build.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build-payload/chroot.log" . 2>/dev/null || true
          ls -la
          git init -q .
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "ci failure log ${GITHUB_RUN_NUMBER}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log
