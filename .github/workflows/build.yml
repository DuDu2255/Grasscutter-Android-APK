name: build-grasscutter-android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare payload
        run: |
          set -o pipefail
          bash scripts/make-payload.sh 2>&1 | tee payload-build.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Grasscutter-Android-${GITHUB_RUN_NUMBER}.apk"
          cp app/src/main/assets/payload.bin payload.tar.gz
          ls -lh Grasscutter-Android-*.apk payload.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: grasscutter-android-apk
          path: Grasscutter-Android-*.apk
          compression-level: 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grasscutter Android ${{ github.run_number }}
          body: "自动构建的 Grasscutter Android 服务端 APK"
          files: |
            Grasscutter-Android-*.apk
            payload.tar.gz

      - name: Publish failure log
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logout && cd /tmp/logout
          cp "$GITHUB_WORKSPACE/payload-build.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/gradle-build.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build-payload/chroot.log" . 2>/dev/null || true
          ls -la
          git init -q .
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "ci failure log ${GITHUB_RUN_NUMBER}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log
