plugins { id 'com.android.application' }

android {
    namespace 'com.dudu2255.astaps'
    compileSdk 36

    defaultConfig {
        applicationId "com.dudu2255.astaps"
        minSdk 26
        targetSdk 36
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '2'}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'bin', 'jar', 'tar', 'tgz', 'xz'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'astaps123'
            keyAlias 'astaps'
            keyPassword 'astaps123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}
