plugins { id 'com.android.application' }

def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'com.dudu2255.astaps'
    compileSdk 34

    defaultConfig {
        applicationId "com.dudu2255.astaps"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'bin', 'jar', 'tar', 'tgz', 'xz'
    }

    signingConfigs {
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}
